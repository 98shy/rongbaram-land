<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="룽바람 랜드에서 사용하는 개인 메모장" />
    <title>룽바람 메모장 | Rongbraram Land</title>
    <link rel="preload" as="image" href="assets/hero-aram-land-v3.jpg" />
    <link rel="stylesheet" href="styles.css?v=21" />
    <script src="memo.js?v=7" defer></script>
  </head>
  <body class="memo-page">
    <main class="memo-page__shell">
      <header class="memo-page__header">
        <div>
          <span class="memo-page__eyebrow">RONGBRARAM LAND</span>
          <h1>룽바람 메모장</h1>
          <p>미션 내용을 적어두세요.</p>
        </div>
        <a class="memo-back" href="index.html" aria-label="룽바람 랜드 챔피언 목록으로 돌아가기">
          <span aria-hidden="true">←</span>
          룽바람 랜드 전적으로 돌아가기
        </a>
      </header>

      <section class="memo-card" aria-labelledby="memoLabel">
        <div class="memo-card__top">
          <label id="memoLabel" class="memo-card__label" for="memoEditor">나의 메모</label>
          <span id="memoSaveStatus" class="memo-save-status" role="status" aria-live="polite">자동 저장됨</span>
        </div>
        <div class="memo-format-toolbar" aria-label="메모 글자 모양 설정">
          <label class="memo-font-control" for="memoFontFamily">
            <span>글씨체</span>
            <select id="memoFontFamily">
              <option value="noto-sans">노토 산스</option>
              <option value="nanum-gothic">나눔고딕</option>
              <option value="nanum-myeongjo">나눔명조</option>
              <option value="gowun-dodum">고운돋움</option>
              <option value="jua">주아</option>
              <option value="do-hyeon">도현</option>
              <option value="gamja-flower">감자꽃</option>
              <option value="gaegu">개구</option>
              <option value="hi-melody">하이멜로디</option>
              <option value="nanum-pen">나눔손글씨 펜</option>
              <option value="poor-story">푸어스토리</option>
              <option value="dongle">동글</option>
              <option value="single-day">싱글데이</option>
              <option value="yeon-sung">연성</option>
              <option value="stylish">Stylish</option>
              <option value="black-han-sans">검은고딕</option>
              <option value="song-myung">송명</option>
              <option value="gowun-batang">고운바탕</option>
            </select>
          </label>
          <button
            id="memoSymbolToggle"
            class="memo-symbol-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="memoSymbolPalette"
          >
            문자표
          </button>
          <div class="memo-size-control" aria-label="메모 글씨 크기 조절">
            <span>글씨 크기</span>
            <div>
              <button id="memoFontSmaller" type="button" aria-label="글씨 크기 1픽셀 줄이기">−</button>
              <strong id="memoFontSize" aria-live="polite">16px</strong>
              <button id="memoFontLarger" type="button" aria-label="글씨 크기 1픽셀 늘리기">+</button>
            </div>
          </div>
        </div>
        <div id="memoSymbolPalette" class="memo-symbol-palette" hidden>
          <div class="memo-symbol-list">
            <button type="button" data-symbol="❤️" aria-label="빨간색 하트">❤️</button>
            <button type="button" data-symbol="🧡" aria-label="주황색 하트">🧡</button>
            <button type="button" data-symbol="💛" aria-label="노란색 하트">💛</button>
            <button type="button" data-symbol="💚" aria-label="초록색 하트">💚</button>
            <button type="button" data-symbol="💙" aria-label="파란색 하트">💙</button>
            <button type="button" data-symbol="💜" aria-label="보라색 하트">💜</button>
            <button type="button" data-symbol="🤎" aria-label="갈색 하트">🤎</button>
            <button type="button" data-symbol="🖤" aria-label="검은색 하트">🖤</button>
            <button type="button" data-symbol="🩶" aria-label="회색 하트">🩶</button>
            <button type="button" data-symbol="🤍" aria-label="흰색 하트">🤍</button>
            <button type="button" data-symbol="🩷" aria-label="분홍색 하트">🩷</button>
            <button type="button" data-symbol="🩵" aria-label="하늘색 하트">🩵</button>
            <button type="button" data-symbol="💘" aria-label="화살이 꽂힌 하트">💘</button>
            <button type="button" data-symbol="💝" aria-label="리본 하트">💝</button>
            <button type="button" data-symbol="💖" aria-label="반짝이는 하트">💖</button>
            <button type="button" data-symbol="💗" aria-label="커지는 하트">💗</button>
            <button type="button" data-symbol="💓" aria-label="뛰는 하트">💓</button>
            <button type="button" data-symbol="💞" aria-label="회전하는 하트">💞</button>
            <button type="button" data-symbol="💕" aria-label="두 개의 하트">💕</button>
            <button type="button" data-symbol="💟" aria-label="하트 장식">💟</button>
            <button type="button" data-symbol="❣️" aria-label="하트 느낌표">❣️</button>
            <button type="button" data-symbol="💔" aria-label="깨진 하트">💔</button>
            <button type="button" data-symbol="❤️‍🔥" aria-label="불타는 하트">❤️‍🔥</button>
            <button type="button" data-symbol="❤️‍🩹" aria-label="회복하는 하트">❤️‍🩹</button>
            <button type="button" data-symbol="⭐" aria-label="노란 별">⭐</button>
            <button type="button" data-symbol="🌟" aria-label="빛나는 별">🌟</button>
            <button type="button" data-symbol="★" aria-label="검은 별">★</button>
            <button type="button" data-symbol="☆" aria-label="빈 별">☆</button>
          </div>
          <p>문자를 누르면 메모의 현재 커서 위치에 입력됩니다.</p>
        </div>
        <textarea
          id="memoEditor"
          class="memo-editor"
          placeholder="메모를 입력하세요."
          spellcheck="true"
        ></textarea>
        <div class="memo-card__footer">
          <span id="memoCharacterCount" class="memo-character-count">0자</span>
          <button id="memoClearButton" class="memo-clear" type="button">메모 전체 삭제</button>
        </div>
      </section>

      <p class="memo-page__notice">메모는 현재 브라우저에만 자동 저장됩니다.</p>
    </main>
  </body>
</html>
