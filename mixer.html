<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="다섯 밸런스 조합을 두 팀으로 무작위 배치하는 룽바람 랜드 팀 섞기" />
    <title>팀 섞기 | Team Mixer</title>
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=1" />
    <link rel="stylesheet" href="styles.css?v=79" />
    <script src="app.js?v=23" defer></script>
    <script type="module" src="mixer.js?v=13"></script>
  </head>
  <body class="mixer-page">
    <main class="mixer-page__shell">
      <section id="mixerRecord" class="mixer-record" aria-labelledby="mixerRecordTitle">
        <div>
          <div class="mixer-record__summary" aria-live="polite">
            <h2 id="mixerRecordTitle">전적 기록</h2>
            <strong id="mixerScore">0승 0패</strong>
            <button id="mixerStake" class="mixer-button mixer-button--secondary mixer-record__stake-trigger" type="button" aria-haspopup="dialog" aria-controls="mixerStakeDialog">판당 별풍선</button>
          </div>
          <div class="mixer-record__controls">
            <div role="group" aria-label="승리 횟수">
              <button class="mixer-button mixer-button--secondary" type="button" data-record="win" data-delta="-1" aria-label="승리 1회 줄이기">−1</button>
              <button class="mixer-button mixer-button--win" type="button" data-record="win" data-delta="1">승리 +1</button>
            </div>
            <div role="group" aria-label="패배 횟수">
              <button class="mixer-button mixer-button--secondary" type="button" data-record="loss" data-delta="-1" aria-label="패배 1회 줄이기">−1</button>
              <button class="mixer-button mixer-button--loss" type="button" data-record="loss" data-delta="1">패배 +1</button>
            </div>
            <div class="mixer-record__settlement">
              <span>최종 결산</span>
              <strong id="mixerSettlement" aria-live="polite">0개</strong>
            </div>
          </div>
          <dialog id="mixerStakeDialog" class="mixer-stake-dialog" aria-labelledby="mixerStakeTitle">
            <h3 id="mixerStakeTitle">판당 별풍선 조절</h3>
            <strong id="mixerStakeValue" aria-live="polite"></strong>
            <div class="mixer-stake-dialog__controls" role="group" aria-labelledby="mixerStakeTitle">
              <button class="mixer-button mixer-button--secondary" type="button" data-stake-delta="-1000" aria-label="판당 별풍선 1000개 줄이기">−1천</button>
              <button class="mixer-button mixer-button--secondary" type="button" data-stake-delta="-100" aria-label="판당 별풍선 100개 줄이기">−100</button>
              <button class="mixer-button mixer-button--secondary" type="button" data-stake-delta="100" aria-label="판당 별풍선 100개 늘리기">+100</button>
              <button class="mixer-button mixer-button--secondary" type="button" data-stake-delta="1000" aria-label="판당 별풍선 1000개 늘리기">+1천</button>
            </div>
            <form method="dialog">
              <button class="mixer-button mixer-button--primary" autofocus>닫기</button>
            </form>
          </dialog>
          <p id="mixerRecordHint" class="mixer-record__hint" role="status"></p>
          <div id="mixerUsedChampions" class="history-champions" aria-label="기록된 사용 챔피언" hidden></div>
        </div>
        <div class="mixer-record__search">
          <div class="mixer-record__search-heading">
            <label for="mixerChampionSearch">사용 챔피언</label>
            <button id="mixerRecordSave" class="mixer-button mixer-button--primary" type="button">전적 저장</button>
          </div>
          <input id="mixerChampionSearch" type="search" placeholder="챔피언 이름 검색" autocomplete="off" />
          <div id="mixerChampionResults" class="mixer-record__results" hidden></div>
          <button id="mixerChampionRetry" class="mixer-button mixer-button--secondary" type="button" hidden>챔피언 목록 다시 불러오기</button>
        </div>
      </section>
      <div class="mixer-layout">
      <section class="mixer-card mixer-entry" aria-labelledby="mixerEntryTitle">
        <div class="mixer-card__heading">
          <div>
            <h2 id="mixerEntryTitle">밸런스 이름 입력</h2>
            <p>각 줄의 두 사람은 서로 반대 팀으로 배치됩니다.</p>
          </div>
          <span>총 10명 · 5개 밸런스</span>
        </div>

        <div id="mixerPairs" class="mixer-pairs"></div>

        <div class="mixer-actions">
          <p id="mixerStatus" role="status" aria-live="polite"></p>
          <div>
            <button id="mixerResetButton" class="mixer-button mixer-button--secondary" type="button">전체 초기화</button>
            <button id="mixerShuffleButton" class="mixer-button mixer-button--primary" type="button">팀 섞기</button>
            <button id="mixerCompleteButton" class="mixer-button mixer-button--complete" type="button" disabled>복사</button>
          </div>
        </div>
      </section>

      <section class="mixer-card mixer-result" aria-labelledby="mixerResultTitle">
        <div class="mixer-card__heading">
          <div>
            <h2 id="mixerResultTitle">팀 구성</h2>
          </div>
        </div>

        <div class="mixer-result__header" aria-hidden="true">
          <span>블루</span>
          <span>VS</span>
          <span>레드</span>
        </div>
        <div id="mixerResultList" class="mixer-result__list"></div>
        <div id="mixerEmpty" class="mixer-empty">
          <strong>결과가 없습니다.</strong>
          <p>10명의 이름을 입력한 뒤, 팀 섞기 버튼을 눌러주세요.</p>
        </div>
      </section>
      </div>

      <p class="mixer-page__notice">입력한 이름과 최근 배치 결과는 현재 브라우저에 자동 저장됩니다.</p>
    </main>
    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
