<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="다섯 밸런스 조합을 두 팀으로 무작위 배치하는 룽바람 랜드 팀 섞기" />
    <title>팀 섞기 | Team Mixer</title>
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=1" />
    <link rel="stylesheet" href="styles.css?v=73" />
    <script src="mixer.js?v=10" defer></script>
  </head>
  <body class="mixer-page">
    <main class="mixer-page__shell">
      <div class="mixer-layout">
      <section class="mixer-card mixer-entry" aria-labelledby="mixerEntryTitle">
        <div class="mixer-card__heading">
          <div>
            <h2 id="mixerEntryTitle">밸런스 이름 입력</h2>
            <p>각 줄의 두 사람은 서로 반대 팀으로 배치됩니다.</p>
          </div>
          <span>총 10명 · 5개 밸런스</span>
        </div>

        <div id="mixerPairs" class="mixer-pairs"></div>

        <div class="mixer-actions">
          <p id="mixerStatus" role="status" aria-live="polite"></p>
          <div>
            <button id="mixerResetButton" class="mixer-button mixer-button--secondary" type="button">전체 초기화</button>
            <button id="mixerShuffleButton" class="mixer-button mixer-button--primary" type="button">팀 섞기</button>
            <button id="mixerCompleteButton" class="mixer-button mixer-button--complete" type="button" disabled>복사</button>
          </div>
        </div>
      </section>

      <section class="mixer-card mixer-result" aria-labelledby="mixerResultTitle">
        <div class="mixer-card__heading">
          <div>
            <h2 id="mixerResultTitle">팀 구성</h2>
          </div>
        </div>

        <div class="mixer-result__header" aria-hidden="true">
          <span>블루</span>
          <span>VS</span>
          <span>레드</span>
        </div>
        <div id="mixerResultList" class="mixer-result__list"></div>
        <div id="mixerEmpty" class="mixer-empty">
          <strong>아직 섞기 결과가 없습니다.</strong>
          <p>열 명의 이름을 입력한 뒤 팀 섞기 버튼을 눌러주세요.</p>
        </div>
      </section>
      </div>

      <p class="mixer-page__notice">입력한 이름과 최근 배치 결과는 현재 브라우저에 자동 저장됩니다.</p>
    </main>
  </body>
</html>
