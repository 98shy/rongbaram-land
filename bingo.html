<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>빙고판</title>
    <meta name="bingo-api" content="" />
    <link rel="icon" href="assets/favicon.png?v=1" />
    <link rel="stylesheet" href="styles.css?v=85" />
    <link rel="stylesheet" href="bingo.css?v=2" />
    <script type="module" src="bingo.js?v=2"></script>
  </head>
  <body class="bingo-page">
    <main class="bingo-shell">
      <header class="bingo-header">
        <a class="bingo-home" href="index.html">← TOOL</a>
        <div class="bingo-actions">
          <button id="shareBoard" class="bingo-button" type="button" hidden>공유 링크 복사</button>
          <button id="newBoard" class="bingo-button" type="button">새 빙고판</button>
        </div>
      </header>
      <p id="bingoStatus" class="bingo-status" role="status"></p>
      <div id="bingoWorkspace" class="bingo-workspace" hidden>
        <section class="bingo-panel" aria-label="빙고판">
          <div class="bingo-panel-heading bingo-board-summary">
            <output id="completedLines" aria-live="polite"></output>
          </div>
          <div id="bingoGrid" class="bingo-grid"></div>
        </section>
        <section class="bingo-panel" aria-labelledby="cellTitle">
          <div class="bingo-panel-heading">
            <h2 id="cellTitle">칸 설정</h2>
          </div>
          <div id="cellEditor" class="bingo-editor"></div>
        </section>
      </div>
    </main>
    <dialog id="boardSetup" class="bingo-dialog" aria-labelledby="setupTitle">
      <form id="setupForm">
        <h2 id="setupTitle">빙고판 크기</h2>
        <select id="boardSize" class="bingo-size" aria-labelledby="setupTitle" autofocus>
          <option value="4">4 × 4</option>
          <option value="5" selected>5 × 5</option>
          <option value="6">6 × 6</option>
          <option value="7">7 × 7</option>
          <option value="8">8 × 8</option>
        </select>
        <div class="bingo-actions">
          <button id="cancelSetup" class="bingo-button" type="button" hidden>취소</button>
          <button class="bingo-button bingo-button--accent" type="submit">만들기</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
