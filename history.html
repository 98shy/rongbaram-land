<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="룽바람 랜드에서 저장한 날짜별 전적" />
    <title>랜드 전적 | Land Records</title>
    <link rel="preconnect" href="https://ddragon.leagueoflegends.com" />
    <link rel="preload" as="image" href="assets/history-header.jpg" />
    <link rel="stylesheet" href="styles.css?v=58" />
    <script src="history.js?v=9" defer></script>
  </head>
  <body class="history-page">
    <main class="history-page__shell">
      <header class="history-page__header">
        <div>
          <h1>랜드 전적</h1>
          <p>룽바람 랜드에서 저장한 전적을 확인해보세요.</p>
        </div>
        <button id="historyCloseButton" type="button">← 뒤로가기</button>
      </header>

      <section class="history-summary" aria-label="밸런스별 누적 전적 요약">
        <div class="history-summary__header" aria-hidden="true">
          <span>밸런스</span>
          <span>랜드 전적</span>
          <span>누적 전적</span>
          <span>누적 결산</span>
        </div>
        <div id="historyBalanceSummary" class="history-summary__list"></div>
      </section>

      <section class="history-card" aria-label="랜드 전적 목록">
        <div class="history-card__title">
          <span id="historyUpdatedAt" aria-live="polite"></span>
        </div>
        <div class="history-table__header" aria-hidden="true">
          <span>날짜</span>
          <span>밸런스</span>
          <span>승패 전적</span>
          <span>사용 챔피언</span>
          <span>최종 결산</span>
          <span aria-label="관리"></span>
        </div>
        <div id="historyList" class="history-list"></div>
        <div id="historyEmpty" class="history-empty" hidden>
          <strong>아직 저장된 랜드 전적이 없습니다.</strong>
          <p>룽바람 랜드에서 전적 저장 버튼을 누르면 여기에 표시됩니다.</p>
        </div>
      </section>

      <p class="history-page__notice">랜드 전적은 현재 브라우저에 저장되며, 다른 탭에서 저장한 내용도 자동으로 반영됩니다.</p>
    </main>

    <a
      class="stream-banner stream-banner--left"
      href="https://www.youtube.com/@%EC%88%98%ED%9E%9B"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="수힛 YouTube 채널 새 탭에서 열기"
      title="수힛 YouTube 채널 바로가기"
    >
      <img
        src="assets/history-youtube-banner.jpg"
        width="360"
        height="945"
        alt="검객 고양이 캐릭터—수힛 YouTube 채널 바로가기"
      />
    </a>

    <a
      class="stream-banner stream-banner--right"
      href="https://www.sooplive.com/station/suhee0051"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="SOOP LIVE 방송국 새 탭에서 열기"
      title="SOOP LIVE 방송국 바로가기"
    >
      <img
        src="assets/history-soop-banner.jpg"
        width="360"
        height="945"
        alt="태양 기사 고양이 캐릭터—SOOP LIVE 방송국 바로가기"
      />
    </a>
  </body>
</html>
